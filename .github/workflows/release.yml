name: Release

on:
  push:
    branches: [main]

# One release at a time; never cancel a release that is already running.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Decide version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts

      # Bumps Cargo.toml and Cargo.lock, writes CHANGELOG.md, commits them as
      # "chore(release): vX.Y.Z [skip ci]", tags vX.Y.Z and creates the GitHub
      # release with notes. The version output is only set when a release happens.
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - arch: x86
            target: i686-pc-windows-msvc
            os: windows-latest
          - arch: arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      # The tag points at the release commit, so the build sees the bumped version.
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false

      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Check crate version matches the tag
        shell: pwsh
        run: |
          $want = '${{ needs.version.outputs.version }}'
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $got = ($meta.packages | Where-Object name -eq 'frostpane').version
          if ($got -ne $want) { throw "frostpane crate version $got does not match release $want" }

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p frostpane

      - name: Package
        shell: pwsh
        run: |
          $name = "frostpane-v${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/frostpane.exe", LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frostpane-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Upload release assets
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v${{ needs.version.outputs.version }}" dist/*.zip dist/SHA256SUMS.txt --clobber
