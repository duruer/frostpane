[package]
name = "fp-win"
description = "Frostpane Windows backend: monitors, DPI, window enumeration and hooks, power, single instance, login item, wallpaper, overlay panels (DirectComposition), layered sprite windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
fp-core.workspace = true
fp-tracker.workspace = true
fp-platform.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
wgpu.workspace = true
tiny-skia.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_DirectComposition",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Devices_Display",
  "Win32_Globalization",
  "Win32_System_RemoteDesktop",
  "Win32_UI_Shell_Common",
] }

[lints]
workspace = true
