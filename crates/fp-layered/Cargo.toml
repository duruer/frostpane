[package]
name = "fp-layered"
description = "Frostpane object windows host: diffing CPU-drawn sprites, alpha hit-testing, z-order bands, over a platform sprite backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
fp-core.workspace = true
fp-paint.workspace = true
fp-platform.workspace = true
log.workspace = true

[dev-dependencies]
fp-win.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
