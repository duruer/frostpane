[package]
name = "fp-overlay"
description = "Frostpane weather overlay host: per-monitor render threads, behind-windows staging and the wgpu pipelines, over a platform panel backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
fp-core.workspace = true
fp-tracker.workspace = true
fp-platform.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true
log.workspace = true

# Backends per target; Windows keeps the workspace set (DX12).
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[lints]
workspace = true

[dev-dependencies]
fp-win.workspace = true
fp-snow.workspace = true
fp-rain.workspace = true
fp-petals.workspace = true
fp-sky.workspace = true
tiny-skia.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
