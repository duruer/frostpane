[package]
name = "fp-overlay"
description = "Frostpane weather overlay: per-monitor click-through windows presented with wgpu (DX12) through DirectComposition."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
fp-core.workspace = true
fp-tracker.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_DirectComposition",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
fp-win.workspace = true
fp-snow.workspace = true
fp-rain.workspace = true
fp-petals.workspace = true
fp-sky.workspace = true
tiny-skia.workspace = true
