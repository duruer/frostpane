[package]
name = "fp-ui"
description = "Frostpane user interface: tray icon and menu, settings window, cards, onboarding (egui/eframe, tray-icon, muda)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
fp-core.workspace = true
fp-text.workspace = true
# pure models and art the windows and cards show (fixed up front so the UI
# owner never edits another crate to reach them)
fp-paint.workspace = true
fp-snow.workspace = true
fp-snowman.workspace = true
fp-trees.workspace = true
fp-decor.workspace = true
fp-characters.workspace = true
fp-world.workspace = true
fp-sources.workspace = true
eframe.workspace = true
log.workspace = true
# Memory-mapped system font files (already in the tree through eframe).
memmap2 = "0.9.12"

# Tray: the crates' default (GTK) menus everywhere but Linux; Linux uses the
# GTK-free StatusNotifierItem host.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { workspace = true, features = ["libappindicator"] }
muda = { workspace = true, features = ["gtk3"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { workspace = true, features = ["ksni"] }
muda = { workspace = true, features = ["snapshot"] }
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
# Headless screenshot harness (src/shots.rs): egui_kittest renders with
# wgpu without a window; the system font provider matches eframe's default
# `system_fonts` fallback (CJK); image writes the PNGs.
egui_kittest.workspace = true
egui_system_font_provider.workspace = true
image.workspace = true
