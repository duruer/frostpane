[package]
name = "fp-mac"
description = "Frostpane macOS backend: screens, CGWindowList window source, Dock shelf, overlay panels (CAMetalLayer), sprite windows, cursor, system notifications, single instance, login item, wallpaper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
fp-core.workspace = true
fp-tracker.workspace = true
fp-platform.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
log.workspace = true
libc.workspace = true
tiny-skia.workspace = true
wgpu = { workspace = true, features = ["metal"] }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-io-kit = "0.3.2"
objc2-service-management = "0.3.2"

[lints]
workspace = true
